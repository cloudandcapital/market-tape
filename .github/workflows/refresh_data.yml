name: Refresh Market Data

on:
  workflow_dispatch:
  schedule:
    # Avoid :00/:30, when GitHub reports elevated schedule-event load and drops.
    - cron: "17,47 13-21 * * 1-5"

# Prevent overlapping refreshes from racing on git push.
# The active run finishes; GitHub retains at most one pending run.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Show package versions
        run: |
          python --version
          python -c "import yfinance, pandas, numpy; print('yfinance', yfinance.__version__); print('pandas', pandas.__version__); print('numpy', numpy.__version__)"

      - name: Build dashboard data
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/refresh_and_publish.sh "$TARGET_BRANCH"
